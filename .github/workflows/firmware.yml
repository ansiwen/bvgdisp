name: Firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to attach the uf2 to a release on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # for the version in the REPL banner

      - name: Install the toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi

      # The pinned dependencies only change with firmware/build.sh
      - uses: actions/cache@v4
        with:
          path: firmware/.deps
          key: deps-${{ hashFiles('firmware/build.sh') }}

      - name: Build
        run: firmware/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bvgdisp-i75w_rp2350
          path: firmware/dist/*.uf2

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" firmware/dist/*.uf2 --clobber
